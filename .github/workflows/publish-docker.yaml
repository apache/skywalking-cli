name: publish-docker

on:
  push:
    branches:
      - master

env:
  SKIP_TEST: true
  HUB: ghcr.io/apache/skywalking-cli

jobs:
  build:
    if: github.repository == 'apache/skywalking-cli'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 30
    env:
      VERSION: ${{ github.sha }}
      APP_NAME: skywalking-cli
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      # Plain `docker login` instead of docker/login-action: the ASF allow-list
      # expires third-party SHA pins, which broke this job repeatedly (#229, #231).
      - name: Log in to the Container registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$HUB" --username "$REGISTRY_USER" --password-stdin
      - name: Build and push docker images
        run: make docker.push || make docker.push
